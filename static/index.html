<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk · Bhagavatam Assistance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bg.css">
  <link rel="stylesheet" href="/static/saved.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="stars"></div>
    <div class="stars s2"></div>
    <div class="sunglow"></div>

    <svg class="mandala" viewBox="-300 -300 600 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="pet" d="M0 -120 C 30 -170, 30 -230, 0 -280 C -30 -230, -30 -170, 0 -120 Z"/>
      </defs>
      <g fill="none" stroke="#f4bd50" stroke-width="1.6">
        <circle r="292"/>
        <circle r="112"/>
        <circle r="64"/>
        <circle r="30"/>
        <use href="#pet"/>
        <use href="#pet" transform="rotate(30)"/>
        <use href="#pet" transform="rotate(60)"/>
        <use href="#pet" transform="rotate(90)"/>
        <use href="#pet" transform="rotate(120)"/>
        <use href="#pet" transform="rotate(150)"/>
        <use href="#pet" transform="rotate(180)"/>
        <use href="#pet" transform="rotate(210)"/>
        <use href="#pet" transform="rotate(240)"/>
        <use href="#pet" transform="rotate(270)"/>
        <use href="#pet" transform="rotate(300)"/>
        <use href="#pet" transform="rotate(330)"/>
        <use href="#pet" transform="rotate(15) scale(.5)"/>
        <use href="#pet" transform="rotate(45) scale(.5)"/>
        <use href="#pet" transform="rotate(75) scale(.5)"/>
        <use href="#pet" transform="rotate(105) scale(.5)"/>
        <use href="#pet" transform="rotate(135) scale(.5)"/>
        <use href="#pet" transform="rotate(165) scale(.5)"/>
        <use href="#pet" transform="rotate(195) scale(.5)"/>
        <use href="#pet" transform="rotate(225) scale(.5)"/>
        <use href="#pet" transform="rotate(255) scale(.5)"/>
        <use href="#pet" transform="rotate(285) scale(.5)"/>
        <use href="#pet" transform="rotate(315) scale(.5)"/>
        <use href="#pet" transform="rotate(345) scale(.5)"/>
      </g>
    </svg>

    <div class="om-big">ॐ</div>

    <i style="left:6%;  --s:6px; --d:15s; --delay:0s"></i>
    <i style="left:14%; --s:4px; --d:19s; --delay:3s"></i>
    <i style="left:22%; --s:7px; --d:17s; --delay:7s"></i>
    <i style="left:31%; --s:5px; --d:21s; --delay:1s"></i>
    <i style="left:40%; --s:4px; --d:16s; --delay:9s"></i>
    <i style="left:48%; --s:6px; --d:20s; --delay:5s"></i>
    <i style="left:57%; --s:5px; --d:18s; --delay:11s"></i>
    <i style="left:65%; --s:7px; --d:22s; --delay:2s"></i>
    <i style="left:73%; --s:4px; --d:15s; --delay:8s"></i>
    <i style="left:81%; --s:6px; --d:19s; --delay:4s"></i>
    <i style="left:89%; --s:5px; --d:17s; --delay:10s"></i>
    <i style="left:95%; --s:4px; --d:21s; --delay:6s"></i>
  </div>

  <header>
    <div class="brandbox">
      <span class="om-mini">ॐ</span>
      <div>
        <h1>Bhagavatam Assistance</h1>
        <p class="sub">Gentle guidance inspired by the Śrīmad-Bhāgavatam</p>
      </div>
    </div>
    <div class="hnav">
      <a href="/">Home</a>
      <a href="/verses">Verses</a>
      <button id="newChat" type="button">New chat</button>
    </div>
  </header>

  <div id="demoBanner" hidden style="display:none"></div>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <p class="notice">This app offers spiritual guidance only. It is not a substitute for a doctor or therapist. In India, free help is available on Tele-MANAS: 14416.</p>
    <form id="form">
      <select id="lang" title="Language for voice typing and listening">
        <option value="en-IN">English</option>
        <option value="hi-IN">हिन्दी</option>
      </select>
      <button type="button" id="mic" title="Voice typing" aria-label="Voice typing">🎤</button>
      <textarea id="input" rows="1" placeholder="Type or speak how you feel..."></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </footer>

  <script src="/static/app.js"></script>
  <script src="/static/saved.js"></script>
</body>
</html>
